<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Recommender | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<div id="loader" class="loader hidden"></div>

<body class="auth-body">

  <div class="auth-card">
    <h1 class="logo">Job Recommender</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <div class="tabs">
      <button id="loginTab" class="tab active" onclick="showLogin()">Login</button>
      <button id="signupTab" class="tab" onclick="showSignup()">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="auth-form">
      <h2>Welcome back</h2>
      <p class="sub">Login to your account</p>

      <input type="text" id="loginUsername" placeholder="Username" required>
      <input type="password" id="loginPassword" placeholder="Password" required>

      <button type="submit">Login</button>
    </form>

    <!-- SIGNUP -->
    <form id="signupForm" class="auth-form hidden">
      <h2>Create account</h2>
      <p class="sub">Sign up to get job recommendations</p>

      <input type="text" id="signupUsername" placeholder="Username" required>
      <input type="password" id="signupPassword" placeholder="Password" required>

      <button type="submit">Sign Up</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
